name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      FINGUARD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests on PostgreSQL (row-level security, concurrency)
        run: uv run pytest
      - name: Tests on SQLite
        run: FINGUARD_TEST_BACKEND=sqlite uv run pytest
      - name: Dependency audit
        run: uvx pip-audit --strict -r <(uv export --frozen --no-hashes --no-dev)

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API client matches the contract
        run: npm run gen:api && git diff --exit-code lib/api-types.ts
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm audit --omit=dev --audit-level=high

  images:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finguard-backend .
      - run: docker build -t finguard-web apps/web
